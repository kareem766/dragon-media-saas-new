name: One-time Ryan Facebook fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ryan channel support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/admin/[route].ts')
          s = p.read_text()
          old = "if (conversation.channel !== 'whatsapp') return res.status(200).json({ ok: true, skipped: true, reason: 'not_whatsapp' })"
          new = "if (!['whatsapp', 'facebook', 'messenger', 'instagram'].includes(String(conversation.channel || ''))) return res.status(200).json({ ok: true, skipped: true, reason: 'unsupported_channel' })"
          if old not in s:
              print('Ryan channel guard already patched or not found')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet -- api/admin/'[route].ts'; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin/'[route].ts'
          git commit -m "Enable Ryan for Facebook and Instagram conversations"
          git push
