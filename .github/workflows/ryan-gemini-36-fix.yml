name: Ryan Gemini model fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update Ryan Gemini model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/admin/[route].ts')
          s = p.read_text()
          old = "let model = process.env.RYAN_GEMINI_MODEL || 'gemini-2.5-flash'"
          new = "let model = process.env.RYAN_GEMINI_MODEL || 'gemini-3.6-flash'"
          if old not in s:
              raise SystemExit('Ryan Gemini model target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'api/admin/[route].ts'
          git commit -m 'Use available Gemini 3.6 model for Ryan'
          git rm .github/workflows/ryan-gemini-36-fix.yml
          git commit -m 'Remove temporary Ryan Gemini model workflow'
          git push