name: Apply Ryan customer notes update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-ryan-notes.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Ryan notes safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/admin/ryan-inbox.ts')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function appendRyanCustomerUpdateNote(')
          if start < 0:
              raise SystemExit('Ryan notes function not found; no changes made')
          end=s.find('\nasync function executeAction(', start)
          if end < 0:
              raise SystemExit('Ryan notes function boundary not found; no changes made')
          new_func=r'''async function appendRyanCustomerUpdateNote(supabase:any,organizationId:string,customer:any,conversation:any,details:any,urgent:boolean){
 if(!customer?.id)return;
 const name=text(customer?.name,120)||text(details?.name,120)||'غير مسجل';
 const phone=cleanPhone(text(customer?.phone,80)||text(details?.phone,80))||'غير مسجل';
 const service=text(details?.service,160)||text(details?.intent,160)||'غير محددة';
 const budget=text(details?.budget,120)||budgetFromText(text(details?.raw_message,1000))||'غير محددة';
 const governorate=text(details?.governorate,120)||text(details?.city,120)||text(details?.location,120)||'غير محددة';
 const note='بيانات العميل | الاسم: '+name+' | الهاتف: '+phone+' | الخدمة المطلوبة: '+service+' | الميزانية: '+budget+' | المحافظة: '+governorate+(urgent?' | الاستعجال: نعم':'');
 const {data:latest}=await supabase.from('customers').select('notes').eq('id',customer.id).eq('organization_id',organizationId).maybeSingle();
 const current=String(latest?.notes||'').replace(/\\n/g,'\n');
 const lines=current.split('\n').map((line:string)=>line.trim()).filter(Boolean);
 const humanLines=lines.filter((line:string)=>!/^بيانات العميل \|/.test(line)&&!/^بيانات تم جمعها بواسطة Ryan \|/.test(line));
 const notes=[...humanLines,note].join('\n').slice(-12000);
 const {error}=await supabase.from('customers').update({notes,updated_at:new Date().toISOString()}).eq('id',customer.id).eq('organization_id',organizationId);
 if(error)throw new Error(error.message);
}
'''
          s=s[:start]+new_func+s[end:]
          # Add governorate to Gemini structured output only if it is not already present.
          if "governorate:{type:'string'}" not in s:
              needle="budget:{type:'string'},intent:{type:'string'},confidence:{type:'number'}"
              replacement="budget:{type:'string'},governorate:{type:'string'},intent:{type:'string'},confidence:{type:'number'}"
              if needle not in s:
                  raise SystemExit('Gemini schema anchor not found; refusing partial change')
              s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/admin/ryan-inbox.ts
          git diff --cached --quiet || git commit -m 'fix: keep Ryan customer notes concise and current'
          git push
