name: Fix Ryan Gemini fallback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ryan Gemini resilience
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/admin/[route].ts')
          s = p.read_text()
          s = s.replace("let model = process.env.RYAN_GEMINI_MODEL || 'gemini-3.6-flash'", "let model = process.env.RYAN_GEMINI_MODEL || 'gemini-2.5-flash'")
          old = """      if (response.ok) aiBody = await response.json()\n      else if (response.status >= 400 && response.status < 500 && response.status !== 408 && response.status !== 429) return res.status(502).json({ error: 'تعذر تشغيل Ryan حاليًا.' })"""
          new = """      if (response.ok) {\n        aiBody = await response.json()\n      } else {\n        const errorText = await response.text()\n        console.error('Ryan inbox Gemini response failed', { status: response.status, model, body: errorText.slice(0, 1000) })\n        aiBody = null\n      }"""
          if old not in s:
              raise SystemExit('Expected Gemini response block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin/[route].ts
          git commit -m "Harden Ryan Gemini fallback" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-ryan-gemini.yml || true
          git commit -m "Remove temporary Ryan Gemini fix workflow" || exit 0
          git push
